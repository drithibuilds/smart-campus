
<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Smart Campus Complaint Management System</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}

body{

    height:100vh;

    display:flex;

    justify-content:center;

    align-items:center;

    background:
    linear-gradient(
        135deg,
        #1e3c72,
        #2a5298
    );

}

/* LOGIN CARD */

.card{

    width:420px;

    padding:40px;

    background:rgba(255,255,255,0.15);

    backdrop-filter:blur(15px);

    border-radius:20px;

    box-shadow:0 8px 32px rgba(0,0,0,0.25);

    color:white;

}

/* HEADING */

.card h1{

    text-align:center;

    margin-bottom:10px;

    font-size:28px;

}

.card p{

    text-align:center;

    margin-bottom:25px;

    color:#e5e7eb;

}

/* INPUTS */

.input-group{

    margin-bottom:18px;

}

.input-group label{

    display:block;

    margin-bottom:6px;

    font-weight:600;

}

.input-group input{

    width:100%;

    padding:12px;

    border:none;

    border-radius:10px;

    outline:none;

    font-size:15px;

}

/* BUTTON */

.btn{

    width:100%;

    padding:12px;

    border:none;

    border-radius:10px;

    background:#00c896;

    color:white;

    font-size:16px;

    font-weight:bold;

    cursor:pointer;

    transition:0.3s;

}

.btn:hover{

    background:#00a67d;

}

/* REGISTER LINK */

.register{

    text-align:center;

    margin-top:18px;

}

.register a{

    color:#ffffff;

    font-weight:bold;

    text-decoration:none;

}

.register a:hover{

    text-decoration:underline;

}

/* PROJECT TITLE */

.logo{

    text-align:center;

    font-size:50px;

    margin-bottom:15px;

}

</style>

</head>

<body>

<div class="card">

    <div class="logo">
        🎓
    </div>

    <h1>Smart Campus</h1>

    <p>Complaint Management System</p>

    <div class="input-group">

        <label>Email Address</label>

        <input
            type="email"
            id="email"
            placeholder="Enter your email"
        >

    </div>

    <div class="input-group">

        <label>Password</label>

        <input
            type="password"
            id="password"
            placeholder="Enter your password"
        >

    </div>

    <button
        class="btn"
        onclick="login()"
    >
        Login
    </button>

    <div class="register">

        Don't have an account?

        <a href="register.html">
            Register Here
        </a>

    </div>

</div>

<script>

function login() {

    fetch("/login", {

        method: "POST",

        headers: {
            "Content-Type": "application/json"
        },

        body: JSON.stringify({

            email:
            document.getElementById("email").value,

            password:
            document.getElementById("password").value

        })

    })

    .then(res => res.json())

    .then(data => {

        if(data.role === "student"){

            localStorage.setItem(
                "student",
                JSON.stringify(data)
            );

            window.location.href =
            "student.html";
        }

        else if(data.role === "admin"){

            localStorage.setItem(
                "admin",
                JSON.stringify(data)
            );

            window.location.href =
            "admin.html";
        }

        else{

            alert(
                "Invalid Email or Password"
            );
        }

    });

}

</script>

</body>
</html>

<!DOCTYPE html>
<html>

<head>

    <title>Admin Dashboard</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

    <div class="topbar">

        <h1>Admin Dashboard</h1>

        <button onclick="logout()">
            Logout
        </button>

    </div>

    <div class="stats-container">

    <div class="card">

        <h3>Total</h3>

        <h2 id="totalComplaints">0</h2>

    </div>

    <div class="card">

        <h3>Pending</h3>

        <h2 id="pendingComplaints">0</h2>

    </div>

    <div class="card">

        <h3>In Progress</h3>

        <h2 id="progressComplaints">0</h2>

    </div>

    <div class="card">

        <h3>Resolved</h3>

        <h2 id="resolvedComplaints">0</h2>

    </div>

</div>

    <div class="filter-container">

    <input
        type="text"
        id="searchText"
        placeholder="Search Complaint"
        onkeyup="loadAdminComplaints()"
    >

    <select
        id="filterStatus"
        onchange="loadAdminComplaints()"
    >

        <option value="">
            All Status
        </option>

        <option value="Pending">
            Pending
        </option>

        <option value="Assigned">
            Assigned
        </option>

        <option value="In Progress">
            In Progress
        </option>

        <option value="Resolved">
            Resolved
        </option>

    </select>

    <select
        id="filterCategory"
        onchange="loadAdminComplaints()"
    >

        <option value="">
            All Categories
        </option>

        <option value="Electrical">
            Electrical
        </option>

        <option value="Water">
            Water
        </option>

        <option value="WiFi">
            WiFi
        </option>

        <option value="Hostel">
            Hostel
        </option>

        <option value="Cleaning">
            Cleaning
        </option>

        <option value="Classroom">
            Classroom
        </option>

        <option value="Other">
            Other
        </option>

    </select>

</div>

    <h2 style="text-align:center;">
        All Complaints
    </h2>

    <table>

        <thead>

            <tr>

                <th>ID</th>

                <th>Name</th>

                <th>Email</th>

                <th>Category</th>

                <th>Complaint</th>

                <th>Department</th>

                <th>Priority</th>

                <th>Status</th>

                <th>Update</th>

                <th>Delete</th>

            </tr>

        </thead>

        <tbody id="tableBody">

        </tbody>

    </table>

    <script src="js/script.js"></script>

    <script>

    loadAdminComplaints();

    loadDashboardStats();

</script>

</body>

</html>
